name: Build Fedora RPM

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build python3-devel make tar gzip git

      - uses: actions/checkout@v4

      - name: Build RPM
        run: make rpm

      - name: Stage RPM for upload
        run: |
          mkdir -p out
          cp /root/rpmbuild/RPMS/noarch/*.rpm out/
          ls -la out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: audi-converter-rpm
          path: out/*.rpm

      - name: Attach to release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.rpm
